name: Update BGA Game Night Site

on:
  push:
    paths:
      - 'games.txt'
      - 'build_site.py'
      - 'template.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch BGG data and build index.html
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: python build_site.py
      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add games_data.json index.html
          git diff --staged --quiet || git commit -m "Auto-update game data and index.html"
          git pull --rebase && git push
