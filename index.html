<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGA Game Night Hub</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --text:#f8fafc; --muted:#94a3b8; --border:#334155; }
  * { box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { background:var(--bg); color:var(--text); padding:16px; max-width:1100px; margin:0 auto; }
  header, .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
  .btn { background:var(--card); color:var(--text); border:1px solid var(--border); padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:600; }
  .btn-primary { background:var(--accent); color:#0f172a; border:none; }
  .controls { background:var(--card); padding:14px; border-radius:12px; border:1px solid var(--border); margin:16px 0; display:grid; gap:10px; }
  input, select, textarea { background:var(--bg); color:var(--text); border:1px solid var(--border); padding:8px 12px; border-radius:8px; }
  .chip { background:var(--bg); border:1px solid var(--border); color:var(--muted); padding:6px 12px; border-radius:999px; cursor:pointer; font-size:0.85rem; }
  .chip.active { background:var(--accent); color:#0f172a; font-weight:700; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; }
  .card:hover { border-color:var(--accent); }
  .thumb { width:48px; height:48px; border-radius:8px; object-fit:cover; float:left; margin-right:10px; }
  .meta { color:var(--muted); font-size:0.85rem; }
  .tags { margin-top:8px; font-size:0.78rem; color:var(--accent); clear:both; }
  dialog { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:14px; padding:20px; max-width:460px; width:92%; }
  .elo-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); }
</style>
</head>
<body>
<header>
  <div><h1 style="margin:0;font-size:1.4rem;">🎲 BGA Game Night Hub</h1><div class="meta" id="countLabel"></div></div>
  <div class="row">
    <button class="btn" onclick="document.getElementById('addModal').showModal()">+ Game</button>
    <button class="btn" onclick="openSync()">🔄 Sync ELOs</button>
    <button class="btn" onclick="openCrew()">👥 Crew</button>
    <button class="btn btn-primary" onclick="pickRandom()">🎲 Random</button>
  </div>
</header>
<div class="controls">
  <div class="row" style="justify-content:flex-start;">
    <input type="text" id="q" placeholder="Search game or mechanic..." oninput="render()" style="flex:1;">
    <select id="pf" onchange="render()"><option value="0">Any Players</option><option value="1">1P</option><option value="2">2P</option><option value="3">3P</option><option value="4">4P</option><option value="5">5P</option><option value="6">6+P</option></select>
    <select id="tf" onchange="render()"><option value="999">Any Time</option><option value="20">≤20m</option><option value="30">≤30m</option><option value="45">≤45m</option><option value="60">≤60m</option></select>
    <select id="wf" onchange="render()"><option value="5">Any Weight</option><option value="1.5">Light ≤1.5</option><option value="2.2">Med-Light ≤2.2</option><option value="3">Med ≤3.0</option></select>
  </div>
  <div class="row" style="justify-content:flex-start;">
    <span class="chip" onclick="chip(this,'2p')">2 Players</span><span class="chip" onclick="chip(this,'4p')">4 Players</span>
    <span class="chip" onclick="chip(this,'fast')">⚡ ≤20m</span><span class="chip" onclick="chip(this,'light')">🪶 Light</span><span class="chip" onclick="chip(this,'coop')">🤝 Co-op</span>
  </div>
</div>
<div class="grid" id="grid"></div>
<dialog id="gModal"><h2 id="mTitle" style="margin-top:0"></h2><p class="meta" id="mMeta"></p><h3>🏆 Crew ELOs</h3><div id="eList"></div><div class="row" style="justify-content:flex-end;margin-top:14px;"><button class="btn btn-primary" onclick="document.getElementById('gModal').close()">Done</button></div></dialog>
<dialog id="cModal"><h2 style="margin-top:0">👥 Crew</h2><div class="row" style="margin-bottom:10px;"><input type="text" id="newM" placeholder="Name..."><button class="btn btn-primary" onclick="addM()">Add</button></div><div id="cList"></div><div class="row" style="margin-top:14px;"><button class="btn" onclick="backup()">⬇️ Backup</button><button class="btn btn-primary" onclick="document.getElementById('cModal').close()">Close</button></div></dialog>
<dialog id="addModal"><h2 style="margin-top:0">+ Add Game</h2><div style="display:grid;gap:8px;"><input type="text" id="aName" placeholder="Game Name"><input type="number" id="aMin" value="2"><input type="number" id="aMax" value="4"><input type="number" id="aTime" value="30"><input type="number" step="0.1" id="aWt" value="1.8"></div><div class="row" style="justify-content:flex-end;margin-top:14px;"><button class="btn" onclick="document.getElementById('addModal').close()">Cancel</button><button class="btn btn-primary" onclick="saveG()">Save</button></div></dialog>
<dialog id="sModal"><h2 style="margin-top:0">🔄 Import BGA ELOs</h2><p class="meta">Paste: <code>Game Name | ELO | Plays</code></p><select id="sMem" style="width:100%;margin-bottom:8px;"></select><textarea id="sTxt" rows="5" style="width:100%;"></textarea><div class="row" style="justify-content:flex-end;margin-top:12px;"><button class="btn" onclick="document.getElementById('sModal').close()">Cancel</button><button class="btn btn-primary" onclick="imp()">Import</button></div></dialog>

function filt(){ const q=document.getElementById('q').value.toLowerCase(), p=+document.getElementById('pf').value, t=+document.getElementById('tf').value, w=+document.getElementById('wf').value; return all().filter(g=>(!q||g.name.toLowerCase().includes(q)||(g.tags||'').toLowerCase().includes(q))&&(!p||(g.min<=p&&(p<6?g.max>=p:g.max>=6)))&&g.time<=t&&g.weight<=w&&(ac!=='2p'||(g.min<=2&&g.max>=2))&&(ac!=='4p'||(g.min<=4&&g.max>=4))&&(ac!=='fast'||g.time<=20)&&(ac!=='light'||g.weight<=1.6)&&(ac!=='coop'||(g.tags||'').toLowerCase().includes('cooperative'))); }
function render(){ const l=filt(); document.getElementById('countLabel').textContent=`Showing ${l.length} of ${all().length} games`; document.getElementById('grid').innerHTML=l.map(g=>`<div class="card" onclick='openG(${JSON.stringify(g).replace(/'/g,"&apos;")})'>${g.thumb?`<img class="thumb" src="${g.thumb}">`:''}<div><strong>${g.name}</strong><div class="meta">👥 ${g.min}–${g.max} · ⏱ ${g.time}m · ⚖️ ${g.weight}/5 ${g.rating?'· ⭐ '+g.rating:''}</div></div><div class="tags">${g.tags||''}</div></div>`).join(''); }
function openG(g){ document.getElementById('mTitle').textContent=g.name; document.getElementById('mMeta').textContent=`${g.min}–${g.max} players · ${g.time} mins · Weight ${g.weight}/5`; const ge=elos[g.name]||{}; document.getElementById('eList').innerHTML=crew.map(m=>`<div class="elo-row"><strong>${m}</strong><input type="text" style="width:150px" value="${ge[m]||''}" onchange="(elos['${g.name.replace(/'/g,"\\'")}']=elos['${g.name.replace(/'/g,"\\'")}']||{})['${m.replace(/'/g,"\\'")}']=this.value;localStorage.setItem('bga_elos',JSON.stringify(elos))"></div>`).join(''); document.getElementById('gModal').showModal(); }
function openCrew(){ renderC(); document.getElementById('cModal').showModal(); }
function renderC(){ document.getElementById('cList').innerHTML=crew.map((m,i)=>`<div class="elo-row"><span>${m}</span><button class="btn" onclick="crew.splice(${i},1);localStorage.setItem('bga_crew',JSON.stringify(crew));renderC()">Remove</button></div>`).join(''); }
function addM(){ const v=document.getElementById('newM').value.trim(); if(v){crew.push(v);localStorage.setItem('bga_crew',JSON.stringify(crew));document.getElementById('newM').value='';renderC();} }
function saveG(){ const name=document.getElementById('aName').value.trim(); if(!name)return; custom.push({name,min:+document.getElementById('aMin').value||2,max:+document.getElementById('aMax').value||4,time:+document.getElementById('aTime').value||30,weight:+document.getElementById('aWt').value||1.5,tags:"Added on Game Night"}); localStorage.setItem('bga_custom',JSON.stringify(custom)); document.getElementById('addModal').close(); render(); }
function openSync(){ document.getElementById('sMem').innerHTML=crew.map(m=>`<option value="${m}">${m}</option>`).join(''); document.getElementById('sModal').showModal(); }
function imp(){ const m=document.getElementById('sMem').value; let c=0; document.getElementById('sTxt').value.split('\n').forEach(l=>{const p=l.split('|').map(s=>s.trim());if(p.length>=2&&p[0]){const match=all().find(g=>g.name.toLowerCase()===p[0].toLowerCase());const t=match?match.name:p[0];(elos[t]=elos[t]||{})[m]=p.slice(1).join(' · ');c++;}}); localStorage.setItem('bga_elos',JSON.stringify(elos)); alert(`Updated ${c} games!`); document.getElementById('sModal').close(); }
function pickRandom(){ const l=filt(); if(l.length) openG(l[Math.floor(Math.random()*l.length)]); }
function backup(){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify({crew,elos,custom},null,2)],{type:'application/json'})); a.download='bga_crew_backup.json'; a.click(); }
render();
</script></body></html>
